# Shared toolchain setup for the CI jobs. A local composite action: no
# third-party code, and every `uses:` is pinned to a full commit SHA.
name: Setup toolchain
description: Install Node and the locked dependencies.

runs:
  using: composite
  steps:
    # The pnpm version comes from `packageManager` in package.json, which is
    # also what `pnpm` itself enforces locally. Installed from the npm registry
    # (no third-party action), at a version pinned there.
    - name: Install pnpm
      shell: bash
      run: |
        version="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
        npm install --global --ignore-scripts "pnpm@${version}"
        pnpm --version
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
