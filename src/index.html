<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>susu.dev</title>
    <meta
      name="description"
      content="susu.dev — an interactive hand-inked Sumi and Vermilion waterfront cityscape and personal studio on the web."
    />
    <link rel="canonical" href="https://susu.dev/" />
    <meta name="theme-color" content="#f3ece0" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="susu.dev" />
    <meta property="og:title" content="susu.dev" />
    <meta
      property="og:description"
      content="susu.dev — an interactive hand-inked Sumi and Vermilion waterfront cityscape and personal studio on the web."
    />
    <meta property="og:url" content="https://susu.dev/" />
    <meta property="og:image" content="https://susu.dev/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="susu.dev — Hand-inked Sumi and Vermilion waterfront cityscape"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="susu.dev" />
    <meta
      name="twitter:description"
      content="susu.dev — an interactive hand-inked Sumi and Vermilion waterfront cityscape and personal studio on the web."
    />
    <meta name="twitter:image" content="https://susu.dev/og-image.svg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "susu.dev",
        "url": "https://susu.dev/",
        "description": "susu.dev — an interactive hand-inked Sumi and Vermilion waterfront cityscape and personal studio on the web."
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap"
    />

    <!-- Sets the .dark class before first paint, to avoid a flash. Mirrors src/lib/theme.ts. -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("susu-theme");
          const dark =
            stored === "dark" ||
            ((stored === null || stored === "system") &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main
        style="min-height:100svh;display:grid;place-items:center;padding:2rem;background:#f3ece0;color:#1c1917;font-family:'Fraunces',Georgia,serif;text-align:center;"
      >
        <div>
          <h1 style="margin:0;font-size:clamp(2.5rem,7vw,4.5rem);font-weight:600;letter-spacing:-0.02em;">
            susu.dev
          </h1>
          <p
            style="margin:0.75rem auto 0;max-width:34rem;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.25rem;line-height:1.5;color:#4a443d;"
          >
            An interactive hand-inked Sumi and Vermilion waterfront cityscape and personal studio on
            the web.
          </p>
        </div>
      </main>
    </div>
    <noscript>
      <style>
        #root {
          display: none;
        }
      </style>
      <main
        style="min-height:100svh;display:grid;place-items:center;padding:2rem;background:#f3ece0;color:#1c1917;font-family:'Fraunces',Georgia,serif;text-align:center;"
      >
        <div style="max-width:44rem;width:100%;">
          <img
            src="/og-image.svg"
            alt="susu.dev — Hand-inked Sumi and Vermilion waterfront cityscape"
            width="1200"
            height="630"
            style="width:100%;height:auto;border-radius:8px;box-shadow:0 12px 32px rgba(28,25,23,0.12);"
          />
          <h1 style="margin:1.5rem 0 0;font-size:clamp(2.25rem,6vw,3.5rem);font-weight:600;letter-spacing:-0.02em;">
            susu.dev
          </h1>
          <p
            style="margin:0.75rem auto 0;max-width:34rem;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.25rem;line-height:1.6;color:#4a443d;"
          >
            An interactive hand-inked Sumi and Vermilion waterfront cityscape and personal studio.
            Enable JavaScript to explore the animated ink canvas and palette controls.
          </p>
        </div>
      </main>
    </noscript>
  </body>
</html>
