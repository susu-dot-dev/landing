<!doctype html>
<html lang="en">
  <head>
    <!-- Sets the .dark class before first paint, to avoid a flash. Mirrors src/lib/theme.ts. -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("susu-theme");
          const dark =
            stored === "dark" ||
            ((stored === null || stored === "system") &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript.</noscript>
  </body>
</html>
